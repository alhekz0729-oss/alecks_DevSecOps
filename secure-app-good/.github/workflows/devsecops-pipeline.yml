name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanning tools
        run: |
          python -m pip install --upgrade pip pip-audit
      - name: Run dependency scan
        run: |
          mkdir -p scan-results
          pip-audit --progress=off --strict > scan-results/pip-audit-report.txt
      - name: Upload dependency scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: scan-results/pip-audit-report.txt

  sast-scan:
    name: SAST with Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip semgrep
      - name: Run Semgrep rules
        run: |
          mkdir -p scan-results
          semgrep scan --config .semgrep.yml --sarif --output scan-results/semgrep-report.sarif
          semgrep scan --config .semgrep.yml --output scan-results/semgrep-report.txt
      - name: Upload SAST artifact
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: scan-results

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare secret scan output folder
        run: mkdir -p scan-results
      - name: Run Gitleaks secret scan
        uses: zricethezav/gitleaks-action@v8
        with:
          args: '--path=. --report-format=json --report-path=scan-results/gitleaks-report.json'
      - name: Upload secret scan report
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: scan-results/gitleaks-report.json

  unit-tests:
    name: Unit tests
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run unit tests
        run: pytest -q

  build-image:
    name: Build, scan, and certify image
    needs: [dependency-scan, sast-scan, secret-scan, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image tagged with commit SHA
        run: |
          docker build --pull -t secure-app:${{ github.sha }} .
      - name: Generate SBOM for built image
        run: |
          mkdir -p sbom scan-results
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace anchore/syft:latest packages secure-app:${{ github.sha }} -o cyclonedx-json=sbom/cyclonedx-sbom.json
      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.41.0
        with:
          image-ref: secure-app:${{ github.sha }}
          format: json
          output: scan-results/trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM
      - name: Produce trusted image metadata
        run: |
          echo "image: secure-app:${{ github.sha }}" > scan-results/image-identifier.txt
          echo "build-trust: trusted" >> scan-results/image-identifier.txt
          docker image inspect secure-app:${{ github.sha }} --format '{{.Id}}' > scan-results/image-digest.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            sbom/cyclonedx-sbom.json
            scan-results/trivy-report.json
            scan-results/image-identifier.txt
            scan-results/image-digest.txt
