name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: secure-app
  SBOM_FORMAT: cyclonedx-json

jobs:
  scan:
    name: Static and Dependency Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install semgrep pip-audit
          sudo apt-get update
          sudo apt-get install -y curl jq
          curl -L -o /tmp/gitleaks https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks-linux-amd64
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          curl -L -o /tmp/syft.deb https://github.com/anchore/syft/releases/latest/download/syft_0.87.0_linux_amd64.deb
          sudo apt-get install -y /tmp/syft.deb
          curl -L -o /tmp/trivy.deb https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.44.1_Linux-64bit.deb
          sudo apt-get install -y /tmp/trivy.deb

      - name: Run Semgrep SAST
        run: semgrep --config .semgrep.yml --json --output semgrep.json

      - name: Run dependency audit
        run: pip-audit -r requirements.txt --format json --output pip-audit.json

      - name: Run secret scan
        run: |
          gitleaks detect --source . --report-format json --report-path gitleaks.json || true
          if [ -s gitleaks.json ] && [ "$(jq 'length' gitleaks.json)" -gt 0 ]; then
            echo "Secret scan failed: secrets were detected."
            exit 1
          fi

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts
          path: |
            semgrep.json
            pip-audit.json
            gitleaks.json

  build:
    name: Build, SBOM, and Trusted Image Promotion
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true

      - name: Capture image identifier
        run: |
          IMAGE_ID=$(docker inspect --format='{{.Id}}' ${{ env.IMAGE_NAME }}:${{ github.sha }})
          echo "$IMAGE_ID" > image-id-${{ github.sha }}.txt

      - name: Generate SBOM for image
        run: syft ${{ env.IMAGE_NAME }}:${{ github.sha }} -o ${{ env.SBOM_FORMAT }} > sbom-${{ github.sha }}.json

      - name: Run container vulnerability scan
        run: trivy image --security-checks vuln --format json --output vulnerability-summary-${{ github.sha }}.json ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Mark trusted build
        run: |
          cat > trusted-build-${{ github.sha }}.txt <<EOF
trusted: true
image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
image_id: $(cat image-id-${{ github.sha }}.txt)
commit: $GITHUB_SHA
EOF

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            image-id-${{ github.sha }}.txt
            sbom-${{ github.sha }}.json
            vulnerability-summary-${{ github.sha }}.json
            trusted-build-${{ github.sha }}.txt
