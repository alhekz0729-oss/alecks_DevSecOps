name: Good App - DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'good-app/**'
      - '.github/workflows/good-app-pipeline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'good-app/**'
      - '.github/workflows/good-app-pipeline.yml'

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip pip-audit
      - name: Dependency vulnerability scan
        run: |
          cd good-app && pip-audit --progress=off --strict
      - name: Install dependencies
        run: |
          cd good-app && python -m pip install -r requirements.txt

  unit-tests:
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd good-app && python -m pip install -r requirements.txt
      - name: Run unit tests
        run: |
          cd good-app && pytest -v

  build-image:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          cd good-app && docker build -t good-app:latest .
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@v0.26.0
        continue-on-error: true
        with:
          image-ref: good-app:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

  deploy:
    needs: build-image
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment successful
        run: |
          echo "[SUCCESS] All security checks passed!"
          echo "[INFO] Good App container image is production-ready"
          echo "[INFO] Ready for deployment to staging/production"
